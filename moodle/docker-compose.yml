version: '3.8'

services:
  database:
    image: mariadb:10.11
    command: --max_allowed_packet=64M
    environment:
      - MYSQL_ROOT_PASSWORD=moodle_root_password
      - MYSQL_DATABASE=moodle
      - MYSQL_USER=moodle_user
      - MYSQL_PASSWORD=moodle_password
    volumes:
      - db_data:/var/lib/mysql

  moodle:
    image: moodlehq/moodle-php-apache:8.1
    ports:
      - '8080:80'
    environment:
      - MOODLE_DOCKER_DBHOST=database
      - MOODLE_DOCKER_DBUSER=moodle_user
      - MOODLE_DOCKER_DBPASS=moodle_password
      - MOODLE_DOCKER_DBNAME=moodle
    volumes:
      - ./moodle_code:/var/www/html
      - ./moodle_data:/var/www/moodledata
    depends_on:
      - database

volumes:
  db_data:
  moodle_code:
  moodledata_data: